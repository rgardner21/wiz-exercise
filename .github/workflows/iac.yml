name: IaC · scan and deploy

on:
  pull_request:
    paths: ['terraform/**', '.github/workflows/iac.yml']
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/iac.yml']
  workflow_dispatch:

# Least privilege by default; jobs opt in to what they need.
permissions:
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.9.5'
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # --------------------------------------------------------------------------
  # Gate 1: static analysis of the IaC before anything touches AWS.
  # --------------------------------------------------------------------------
  scan:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          # This repository deliberately contains insecure infrastructure.
          # Every skipped check is an exercise requirement, documented in
          # docs/RISK-ACCEPTANCE.md. Anything NOT on this list still fails
          # the build, so the gate remains real.
          skip_check: >-
            CKV_AWS_18,CKV_AWS_20,CKV_AWS_21,CKV_AWS_53,CKV_AWS_54,
            CKV_AWS_55,CKV_AWS_56,CKV_AWS_24,CKV_AWS_260,CKV_AWS_274,
            CKV_AWS_275,CKV2_AWS_6,CKV2_AWS_61,CKV2_AWS_62,CKV_AWS_79,
            CKV_AWS_88,CKV_AWS_135,CKV_AWS_126,CKV_AWS_8,CKV2_AWS_41,
            CKV_AWS_144,CKV_AWS_145,CKV_TF_1,CKV_AWS_338,CKV_AWS_158,
            CKV2_AWS_11,CKV2_AWS_12,CKV_AWS_339,CKV_AWS_341
          soft_fail: false

      - name: Upload Checkov results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: sarif
          output: trivy-iac.sarif
          exit-code: '0' # reported to code scanning, not a hard gate
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  # --------------------------------------------------------------------------
  # Gate 2: fmt, validate, plan. Runs on every PR with a read-only role.
  # --------------------------------------------------------------------------
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=wiz-exercise/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform -chdir=terraform plan -no-color -input=false -out=tfplan \
            -var="github_repository=${{ github.repository }}" \
            -var="ssh_public_key=${{ secrets.MONGO_SSH_PUBLIC_KEY }}" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            | tee plan.txt
        continue-on-error: true

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const body = ['### Terraform plan', '```', plan.slice(-60000), '```'].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 5

  # --------------------------------------------------------------------------
  # Gate 3: apply. main branch only, behind a protected environment that
  # requires manual approval.
  # --------------------------------------------------------------------------
  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: [scan, plan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=wiz-exercise/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        run: |
          terraform -chdir=terraform apply -auto-approve -input=false \
            -var="github_repository=${{ github.repository }}" \
            -var="ssh_public_key=${{ secrets.MONGO_SSH_PUBLIC_KEY }}" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}"

      - name: Publish outputs to the job summary
        run: |
          {
            echo '### Deployed'
            echo '```'
            terraform -chdir=terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
