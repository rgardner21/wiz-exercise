apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiz-todo
  namespace: wiz-todo
  labels:
    app.kubernetes.io/name: wiz-todo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wiz-todo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wiz-todo
    spec:
      # Bound to cluster-admin by terraform/k8s_bootstrap.tf.
      # INTENTIONAL EXERCISE FINDING.
      serviceAccountName: wiz-todo
      containers:
        - name: wiz-todo
          # Replaced by the app pipeline with the ECR digest.
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Exercise requirement: MongoDB access supplied as an environment
            # variable. Sourced from a Secret rather than a literal so the
            # credential is not sitting in the manifest in git.
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-connection
                  key: MONGODB_URI
            - name: MONGODB_DB
              valueFrom:
                secretKeyRef:
                  name: mongo-connection
                  key: MONGODB_DB
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
